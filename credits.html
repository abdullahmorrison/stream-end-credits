<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream end credits — overlay</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  /* System fonts only. A webfont is a request that can fail or arrive late, and this
     source sits loaded for a whole stream before anyone finds out. */
  body {
    font-family: "Segoe UI", -apple-system, system-ui, "Helvetica Neue", sans-serif;
    color: #fff;
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    /* Names fade in and out at the edges instead of appearing and vanishing on a hard
       line. The gradient is in viewport units so it scales with the source. */
    -webkit-mask-image: linear-gradient(
      to bottom,
      transparent 0,
      #000 12vh,
      #000 88vh,
      transparent 100vh
    );
    mask-image: linear-gradient(
      to bottom,
      transparent 0,
      #000 12vh,
      #000 88vh,
      transparent 100vh
    );
  }

  /* Set from the backdrop param. Zero by default: the ending scene usually has
     something behind this already. */
  #stage::before {
    content: "";
    position: absolute;
    inset: 0;
    background: #0b0a0f;
    opacity: var(--backdrop, 0);
  }

  .reel {
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    /* Set by the scroll loop. translate3d rather than `top` so the whole reel is one
       composited layer and scrolling never triggers layout. */
    transform: translate3d(0, 100vh, 0);
    will-change: transform;
    padding: 0 6vw;
    box-sizing: border-box;
    text-align: center;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.85);
  }

  .card {
    padding: 8vh 0;
  }
  .card-title h1 {
    margin: 0;
    font-size: 5.4vh;
    font-weight: 300;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .card-title .channel {
    margin: 2.2vh 0 0;
    font-size: 3.2vh;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #d3b8ff;
  }
  .card-end p,
  .card-note p {
    margin: 0;
    font-size: 3vh;
    font-weight: 300;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.72;
  }
  .card-note p {
    text-transform: none;
    letter-spacing: 0.02em;
    line-height: 1.6;
  }

  .section {
    padding: 4.5vh 0;
  }
  .section h2 {
    margin: 0 0 3vh;
    font-size: 2.2vh;
    font-weight: 600;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: #b9a7d8;
  }

  .names {
    margin: 0;
    padding: 0;
    list-style: none;
    /* Columns rather than a grid: names flow down one column and into the next, which
       is how credits read, and short lists do not leave a ragged final row. */
    column-count: var(--columns, 3);
    column-gap: 4vw;
  }
  .names li {
    /* A name split across a column break is unreadable and looks like a bug. */
    break-inside: avoid;
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.6em;
    padding: 0.55vh 0;
    font-size: 3.1vh;
    font-weight: 500;
    line-height: 1.35;
  }
  .name {
    /* Long names shrink the line rather than wrapping mid-word or pushing the column. */
    overflow-wrap: anywhere;
  }
  .detail {
    font-size: 0.68em;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    opacity: 0.6;
  }

  .status {
    position: fixed;
    z-index: 4;
    left: 20px;
    top: 20px;
    padding: 7px 13px;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.66);
    color: #fff;
    font: 500 14px/1.4 "Segoe UI", system-ui, sans-serif;
    pointer-events: none;
    transition: opacity 500ms ease;
  }
  .status[hidden] { display: none; }
</style>
</head>
<body>
  <div id="stage"></div>
  <div class="status" id="status" hidden></div>

  <script type="module" src="./src/credits-main.js"></script>
</body>
</html>
